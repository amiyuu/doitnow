<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すぐ始める記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== 色とフォント（ここを変えると見た目が変わる） ===== */
:root {
  --paper: #EEF1F4;   /* 背景 */
  --card: #FFFFFF;    /* 入力欄・カードの背景 */
  --ink: #1F2A44;     /* 文字 */
  --muted: #6B7488;   /* 補足の文字 */
  --line: #D3D9E2;    /* 枠線 */
  --marker: #F5C518;  /* 主役のボタンの色 */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161B26; --card: #1F2533; --ink: #E8ECF3; --muted: #9AA3B5; --line: #343C4E; --marker: #F2C230;
  }
}
:root[data-theme="dark"] {
  --paper: #161B26; --card: #1F2533; --ink: #E8ECF3; --muted: #9AA3B5; --line: #343C4E; --marker: #F2C230;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.6;
}
main { max-width: 440px; margin: 0 auto; padding: 16px 18px 48px; }
h1 { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; font-size: 1.4rem; margin: 8px 0 2px; }
.sub { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }

/* タブ（画面上部に固定） */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; background: var(--paper); border-bottom: 1px solid var(--line); margin: 0 -18px 18px; padding: 0 18px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--paper); }
.tabs button {
  flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  color: var(--muted); font: inherit; font-weight: 700; padding: 10px 2px; cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--marker); }
.badge { display: inline-block; min-width: 1.5em; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: .72rem; line-height: 1.5em; }

/* 入力 */
label, .q { display: block; font-weight: 700; font-size: .95rem; margin: 16px 0 8px; }
.hint { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: 6px; }
input[type="text"], input[type="datetime-local"], input[type="time"] {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px;
}
input[type="datetime-local"], input[type="time"] {
  -webkit-appearance: none; appearance: none; display: block; min-width: 0; min-height: 48px; text-align: left;
}
input::-webkit-date-and-time-value { text-align: left; }
.choices { display: flex; gap: 8px; }
.choices button {
  flex: 1; font: inherit; font-size: .95rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 0; cursor: pointer;
}
.choices button[aria-pressed="true"] { border: 2px solid var(--ink); font-weight: 700; padding: 10px 0; }
.scale-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: .75rem; margin-top: 4px; }

/* 記録のボタン */
.btn-now {
  width: 100%; margin-top: 26px; padding: 18px; border: 0; border-radius: 16px;
  background: var(--marker); color: #1F2A44; cursor: pointer;
  font-family: "Zen Maru Gothic", sans-serif; font-size: 1.3rem; font-weight: 700;
}
.btn-now small, .btn-later small { display: block; font-family: inherit; font-size: .78rem; font-weight: 500; margin-top: 2px; }
.btn-later {
  width: 100%; margin-top: 10px; padding: 14px; border: 2px solid var(--ink); border-radius: 16px;
  background: none; color: var(--ink); cursor: pointer;
  font-family: "Zen Maru Gothic", sans-serif; font-size: 1.05rem; font-weight: 700;
}
.btn-now:disabled, .btn-later:disabled, .btn-save:disabled { opacity: .4; cursor: not-allowed; }
.panel { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 16px; }
.panel .q { margin-top: 12px; }
.btn-save {
  width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px;
  background: var(--ink); color: var(--paper); cursor: pointer; font: inherit; font-weight: 700;
}
#startTime { margin-top: 8px; }
.link { display: block; background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: .82rem; margin: 18px auto 0; padding: 4px 0; cursor: pointer; }
.mode-note { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 18px; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 12px 18px;
  text-align: center; font-weight: 700; font-size: .92rem;
}
#toast:empty { display: none; }

/* 一覧 */
.list-sec + .list-sec { margin-top: 26px; }
.list-sec h2 { font-size: .9rem; color: var(--muted); margin: 0 0 4px; font-weight: 700; }
.list-sec h2 small { font-weight: 400; margin-left: 6px; }
.list-sec ul { list-style: none; padding: 0; margin: 0; }
.empty { color: var(--muted); font-size: .9rem; padding: 8px 0; }
li.task { border-bottom: 1px dashed var(--line); }
.task-head {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  background: none; border: 0; color: var(--ink); font: inherit; font-size: .95rem;
  padding: 13px 0; text-align: left; cursor: pointer;
}
.task-time { color: var(--muted); white-space: nowrap; font-size: .8rem; }
.task-body { padding: 0 0 18px; }
.task-body label, .task-body .q { margin: 8px 0 6px; font-size: .88rem; }
.task-body input[type="datetime-local"] { margin-top: 6px; }
.step-show { background: var(--card); border-left: 3px solid var(--marker); border-radius: 6px; padding: 8px 12px; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  font: inherit; font-size: .82rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.go {
  width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px;
  background: var(--ink); color: var(--paper); cursor: pointer;
  font-family: "Zen Maru Gothic", sans-serif; font-size: 1.1rem; font-weight: 700;
}
.go:disabled { opacity: .5; }

/* 集計 */
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.stat h2 { font-size: .95rem; margin: 0 0 10px; }
.stat p { margin: 0; }
.big { font-family: "Zen Maru Gothic", sans-serif; font-size: 1.9rem; font-weight: 700; line-height: 1.2; }
.big small { font-size: .95rem; margin-left: 2px; }
.stat .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
.best { margin-top: 10px; padding: 10px 12px; background: var(--paper); border-radius: 10px; font-size: .88rem; }
.week { display: flex; justify-content: space-between; margin-top: 12px; }
.day { flex: 1; text-align: center; font-size: .72rem; color: var(--muted); }
.dot { width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 50%; border: 2px solid var(--line); }
.dot.on { background: var(--marker); border-color: var(--marker); }
.advice { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--marker); background: var(--paper); border-radius: 6px; font-size: .9rem; }
details.verify { margin-top: 22px; }
details.verify > summary { cursor: pointer; color: var(--muted); font-size: .88rem; font-weight: 700; padding: 8px 0; }
details.verify[open] > summary { margin-bottom: 10px; }
.mode { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.mode button { flex: 1; border: 0; background: none; color: var(--muted); padding: 9px 4px; border-radius: 9px; font: inherit; font-size: .85rem; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp { background: var(--paper); border-radius: 10px; padding: 12px 8px; text-align: center; }
.cmp-name { font-size: .8rem; color: var(--muted); }
.cmp-num { font-family: "Zen Maru Gothic", sans-serif; font-size: 1.3rem; font-weight: 700; }
.cmp-n { font-size: .78rem; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
.stat table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.stat th, .stat td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.stat th:first-child, .stat td:first-child { text-align: left; }
.stat th { color: var(--muted); font-weight: 400; font-size: .78rem; }
.stat td small { color: var(--muted); }
.bar-row { display: grid; grid-template-columns: 9.5em 1fr 2em; align-items: center; gap: 8px; font-size: .82rem; margin: 6px 0; }
.bar { height: 10px; background: var(--paper); border-radius: 5px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--marker); }
.bar-row b { text-align: right; }
</style>
</head>
<body>
<main>
  <h1>すぐ始める記録</h1>
  <p class="sub">2分でできる最初の一手だけ、やってみる。</p>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="record" aria-selected="true">記録</button>
    <button type="button" role="tab" data-tab="list" aria-selected="false">一覧<span class="badge" id="listBadge" hidden></span></button>
    <button type="button" role="tab" data-tab="stats" aria-selected="false">集計</button>
  </nav>

  <!-- ===== 記録タブ ===== -->
  <section id="tab-record">
    <label for="title" style="margin-top:4px">課題名</label>
    <input type="text" id="title" placeholder="例：英語のレポート" autocomplete="off">

    <span class="q">重さ<span class="hint">量や難しさ</span></span>
    <div class="choices" id="weight">
      <button type="button" data-v="1">軽い</button>
      <button type="button" data-v="2">普通</button>
      <button type="button" data-v="3">重い</button>
    </div>

    <span class="q">嫌さ<span class="hint">今の気持ち</span></span>
    <div class="choices" id="iyasa">
      <button type="button" data-v="1">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="4">4</button>
      <button type="button" data-v="5">5</button>
    </div>
    <div class="scale-ends"><span>平気</span><span>かなり嫌</span></div>

    <div id="stepBox">
      <label for="firstStep">最初の一手<span class="hint">2分でできること</span></label>
      <input type="text" id="firstStep" placeholder="例：Wordを開いてタイトルを書く" autocomplete="off">
    </div>

    <!-- 今すぐ取り掛かる：1回で着手まで記録 -->
    <button type="button" class="btn-now" id="btnNow" disabled>今すぐ着手する<small>一手を始めたらタップ</small></button>

    <!-- 今はできない：やらなきゃとして登録 -->
    <button type="button" class="btn-later" id="btnLater" disabled aria-expanded="false">今はできない（やらなきゃ）<small>取り掛かれる時刻を決めて登録</small></button>
    <div class="panel" id="laterPanel" hidden>
      <span class="q">いつから取り掛かれる？</span>
      <div class="choices" id="startable">
        <button type="button" data-v="0" aria-pressed="true">今から</button>
        <button type="button" data-v="30">30分後</button>
        <button type="button" data-v="60">1時間後</button>
        <button type="button" data-v="custom">時刻指定</button>
      </div>
      <input type="time" id="startTime" hidden>
      <button type="button" class="btn-save" id="btnLaterSave">やらなきゃに登録</button>
    </div>

    <!-- 過去の課題を後から記録 -->
    <button type="button" class="link" id="retroToggle" aria-expanded="false">過去の課題を後から記録する</button>
    <div class="panel" id="retroPanel" hidden>
      <label for="yAt">「やらなきゃ」と思った日時<span class="hint">授業中などはその後の時刻</span></label>
      <input type="datetime-local" id="yAt">
      <label for="cAt">着手した日時<span class="hint">まだなら空欄</span></label>
      <input type="datetime-local" id="cAt">
      <button type="button" class="btn-save" id="btnRetroSave" disabled>後から記録する</button>
    </div>

    <p class="mode-note" id="modeNote"></p>
  </section>

  <!-- ===== 一覧タブ ===== -->
  <section id="tab-list" hidden>
    <div class="list-sec">
      <h2>まだ着手していない<small>タップして着手を記録</small></h2>
      <ul id="list"></ul>
    </div>
    <div class="list-sec">
      <h2>取り組み中<small>タップして見積もり・完了</small></h2>
      <ul id="doing"></ul>
    </div>
  </section>

  <!-- ===== 集計タブ ===== -->
  <section id="tab-stats" hidden>
    <div id="stats"></div>
    <details class="verify">
      <summary>検証用のくわしいデータ</summary>
      <div class="stat">
        <h2>記録期間の設定</h2>
        <div class="mode" role="group" aria-label="記録期間">
          <button type="button" data-mode="baseline">いつも通りの期間</button>
          <button type="button" data-mode="ichite">最初の一手を試す期間</button>
        </div>
        <p class="note">これから登録する課題が、どちらの期間として記録されるかを選びます。</p>
      </div>
      <div id="verifyStats"></div>
    </details>
  </section>

  <div id="toast" role="status"></div>
</main>

<script>
/* =========================================================
   ① データの保存（ここは触らなくてOK）
   claude.ai上ではアカウントに保存。使えない時はこの端末に保存。
   ========================================================= */
const store = {
  db: null, uid: null, ready: false,
  async init() {
    try {
      if (window.claude && claude.use) {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.uid = uid; }
      }
    } catch (e) { /* 端末保存に切り替え */ }
    this.ready = true;
  },
  col() { return this.db.collection("data/users/" + this.uid + "/tasks"); },
  localAll() { try { return JSON.parse(localStorage.getItem("tasks") || "[]"); } catch (e) { return []; } },
  async all() {
    if (this.db) { const s = await this.col().get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); }
    return this.localAll();
  },
  async save(task) {
    if (this.db) { const { id, ...body } = task; return this.col().doc(id).set(body); }
    const list = this.localAll().filter(t => t.id !== task.id); list.push(task);
    try { localStorage.setItem("tasks", JSON.stringify(list)); } catch (e) {}
  }
};

/* =========================================================
   ② 共通の道具
   ========================================================= */
const weightName = { 1: "軽い", 2: "普通", 3: "重い" };
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function clock(ms) {
  const d = new Date(ms);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
}
function since(from, to) {
  const m = Math.max(0, Math.floor(((to || Date.now()) - from) / 60000));
  if (m < 60) return m + "分";
  if (m < 1440) return Math.floor(m / 60) + "時間";
  return Math.floor(m / 1440) + "日";
}
function fmtDur(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return m + "分";
  if (m < 1440) { const h = Math.floor(m / 60), r = m % 60; return h + "時間" + (r ? r + "分" : ""); }
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d + "日" + (h ? h + "時間" : "");
}
function median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((x, y) => x - y), i = Math.floor(s.length / 2);
  return s.length % 2 ? s[i] : (s[i - 1] + s[i]) / 2;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function showToast(msg) {
  const t = $("toast"); t.textContent = msg;
  clearTimeout(showToast.timer); showToast.timer = setTimeout(() => t.textContent = "", 3000);
}
// 遅れを数え始める時刻（取り掛かれる時刻。古い記録は「やらなきゃ」の時刻）
const startOf = t => t.startableAt || t.yaranakyaAt;
const delay = t => Math.max(0, t.chakushuAt - startOf(t));
function baseLabel(t) {
  return t.startableAt && t.startableAt !== t.yaranakyaAt ? "取り掛かれる時刻から" : "やらなきゃから";
}

/* =========================================================
   ③ タブ
   ========================================================= */
let currentTab = "record";
let tasks = [];
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function showTab(name) {
  currentTab = name;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === name));
  ["record", "list", "stats"].forEach(n => $("tab-" + n).hidden = n !== name);
  window.scrollTo(0, 0);
  render();
}

/* =========================================================
   ④ 記録タブ
   ========================================================= */
const form = { weight: null, iyasa: null, startIn: 0 };
let mode = "ichite";
try { mode = localStorage.getItem("mode") || "ichite"; } catch (e) {}

function showMode() {
  document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("stepBox").hidden = mode !== "ichite";
  $("modeNote").textContent = "記録期間：" + (mode === "ichite" ? "最初の一手を試す期間" : "いつも通りの期間") + "（集計タブで変更）";
}
document.querySelectorAll(".mode button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  try { localStorage.setItem("mode", mode); } catch (e) {}
  showMode();
}));
showMode();

// 重さ・嫌さのボタン
function setupChoices(groupId, key) {
  const buttons = document.querySelectorAll("#" + groupId + " button");
  buttons.forEach(b => b.addEventListener("click", () => {
    form[key] = Number(b.dataset.v);
    buttons.forEach(x => x.setAttribute("aria-pressed", x === b));
    checkReady();
  }));
}
setupChoices("weight", "weight");
setupChoices("iyasa", "iyasa");
$("title").addEventListener("input", checkReady);

// 必須（課題名・重さ・嫌さ）がそろったらボタンを押せるようにする
function checkReady() {
  const ok = $("title").value.trim() && form.weight && form.iyasa;
  $("btnNow").disabled = !ok;
  $("btnLater").disabled = !ok;
  $("btnLaterSave").disabled = !(ok && (form.startIn !== "custom" || $("startTime").value));
  $("btnRetroSave").disabled = !(ok && $("yAt").value);
}

// 「今はできない」パネルと「後から記録」パネルの開閉
function togglePanel(btn, panel, open) {
  panel.hidden = !open;
  btn.setAttribute("aria-expanded", open);
}
$("btnLater").addEventListener("click", () => {
  const open = $("laterPanel").hidden;
  togglePanel($("btnLater"), $("laterPanel"), open);
  if (open) togglePanel($("retroToggle"), $("retroPanel"), false);
});
$("retroToggle").addEventListener("click", () => {
  const open = $("retroPanel").hidden;
  togglePanel($("retroToggle"), $("retroPanel"), open);
  if (open) togglePanel($("btnLater"), $("laterPanel"), false);
});

// 取り掛かれる時刻
document.querySelectorAll("#startable button").forEach(b => b.addEventListener("click", () => {
  form.startIn = b.dataset.v === "custom" ? "custom" : Number(b.dataset.v);
  document.querySelectorAll("#startable button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("startTime").hidden = form.startIn !== "custom";
  if (form.startIn === "custom") $("startTime").focus();
  checkReady();
}));
$("startTime").addEventListener("input", checkReady);
$("yAt").addEventListener("input", checkReady);
function calcStartable(now) {
  if (form.startIn === "custom" && $("startTime").value) {
    const [hh, mm] = $("startTime").value.split(":").map(Number);
    const d = new Date(now);
    d.setHours(hh, mm, 0, 0);
    if (d.getTime() < now - 60000) d.setDate(d.getDate() + 1);  // もう過ぎた時刻なら翌日
    return d.getTime();
  }
  return now + (Number(form.startIn) || 0) * 60000;
}

// 共通の課題データ
function baseTask() {
  return {
    id: "t" + Date.now(),
    title: $("title").value.trim(),
    weight: form.weight,
    iyasa: form.iyasa,
    mode: mode,
    firstStep: mode === "ichite" ? ($("firstStep").value.trim() || null) : null
  };
}
async function saveNew(task, msg, btn) {
  btn.disabled = true;
  try {
    await store.save(task);
    showToast(msg);
    resetForm();
    render();
  } catch (e) {
    showToast("保存できませんでした。もう一度押してください");
    checkReady();
  }
}

// 今すぐ着手：やらなきゃ・取り掛かれる時刻・着手を同時に記録
$("btnNow").addEventListener("click", () => {
  const now = Date.now();
  const task = { ...baseTask(), yaranakyaAt: now, startableAt: now, chakushuAt: now, nowStart: true, retro: false };
  const msg = task.iyasa >= 4 ? "嫌さ" + task.iyasa + "でも、すぐ着手できました！" : "着手できました！ その調子です";
  saveNew(task, msg, $("btnNow"));
});

// 今はできない：やらなきゃとして登録
$("btnLaterSave").addEventListener("click", () => {
  const now = Date.now();
  const task = { ...baseTask(), yaranakyaAt: now, startableAt: calcStartable(now), chakushuAt: null, retro: false };
  const msg = task.startableAt > now + 60000 ? clock(task.startableAt) + "から取り掛かる予定で登録しました" : "登録しました。一覧から着手を記録できます";
  saveNew(task, msg, $("btnLaterSave"));
});

// 後から記録
$("btnRetroSave").addEventListener("click", () => {
  const y = new Date($("yAt").value).getTime();
  const c = $("cAt").value ? new Date($("cAt").value).getTime() : null;
  if (c && c < y) { showToast("着手の日時が「やらなきゃ」より前になっています"); return; }
  const task = { ...baseTask(), yaranakyaAt: y, startableAt: y, chakushuAt: c, retro: true };
  saveNew(task, "記録しました（" + clock(y) + "）", $("btnRetroSave"));
});

function resetForm() {
  $("title").value = ""; $("firstStep").value = "";
  $("yAt").value = ""; $("cAt").value = ""; $("startTime").value = "";
  form.weight = null; form.iyasa = null; form.startIn = 0;
  document.querySelectorAll("#weight button, #iyasa button").forEach(b => b.setAttribute("aria-pressed", false));
  document.querySelectorAll("#startable button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === "0"));
  $("startTime").hidden = true;
  togglePanel($("btnLater"), $("laterPanel"), false);
  checkReady();
}

/* =========================================================
   ⑤ 一覧タブ
   ========================================================= */
// 止まっていた理由（原因分析から）。ここを書き換えると選択肢が変わる
const reasonList = ["何から始めるか分からない", "面倒・退屈", "スマホ・動画", "疲れていた", "完璧にやりたい", "時間がなかった"];
// 見積もりの選択肢（分, 表示）
const estimateList = [[15, "15分"], [30, "30分"], [60, "1時間"], [120, "2時間"], [180, "3時間以上"]];
let openId = null;

function waitLabel(t) {
  const s = startOf(t);
  if (s > Date.now()) return clock(s) + "から取り掛かる";
  return baseLabel(t) + since(s);
}
function renderLists() {
  const waiting = tasks.filter(t => !t.chakushuAt).sort((a, b) => startOf(a) - startOf(b));
  const doing = tasks.filter(t => t.chakushuAt && !t.completedAt).sort((a, b) => b.chakushuAt - a.chakushuAt);
  const badge = $("listBadge");
  badge.hidden = !waiting.length;
  badge.textContent = waiting.length;
  if (currentTab !== "list") return;
  const ul = $("list"), ul2 = $("doing");
  ul.innerHTML = ""; ul2.innerHTML = "";
  if (!waiting.length) ul.append(el("li", "empty", "ありません"));
  waiting.forEach(t => ul.append(waitingCard(t)));
  if (!doing.length) ul2.append(el("li", "empty", "着手した課題がここに出ます"));
  doing.forEach(t => ul2.append(doingCard(t)));
}
function cardHead(t, right) {
  const li = el("li", "task");
  const head = el("button", "task-head");
  head.type = "button";
  head.setAttribute("aria-expanded", openId === t.id);
  head.append(el("span", null, t.title + "（" + weightName[t.weight] + "）"), el("span", "task-time", right));
  head.addEventListener("click", () => { openId = openId === t.id ? null : t.id; renderLists(); });
  li.append(head);
  return li;
}
function manualTime(label) {
  const forgot = el("button", "link", label);
  forgot.type = "button";
  forgot.style.margin = "10px 0 0";
  const input = el("input");
  input.type = "datetime-local";
  input.hidden = true;
  forgot.addEventListener("click", () => { input.hidden = false; forgot.hidden = true; input.focus(); });
  return [forgot, input];
}

// まだ着手していない課題
function waitingCard(t) {
  const li = cardHead(t, waitLabel(t));
  if (openId !== t.id) return li;
  const body = el("div", "task-body");

  let stepInput = null;
  if (t.mode === "ichite") {
    if (t.firstStep) {
      body.append(el("span", "q", "最初の一手"), el("div", "step-show", t.firstStep));
    } else {
      body.append(el("label", null, "最初の一手（2分でできること）"));
      stepInput = el("input");
      stepInput.type = "text";
      stepInput.placeholder = "例：Wordを開いてタイトルを書く";
      body.append(stepInput);
    }
  }

  body.append(el("span", "q", "止まっていた理由（あれば）"));
  const chips = el("div", "chips");
  const picked = new Set(t.reasons || []);
  reasonList.forEach(r => {
    const b = el("button", null, r);
    b.type = "button";
    b.setAttribute("aria-pressed", picked.has(r));
    b.addEventListener("click", () => {
      picked.has(r) ? picked.delete(r) : picked.add(r);
      b.setAttribute("aria-pressed", picked.has(r));
    });
    chips.append(b);
  });
  body.append(chips);

  const go = el("button", "go", "着手した");
  go.type = "button";
  const [forgot, manual] = manualTime("押し忘れた（着手した日時を入力）");
  go.addEventListener("click", async () => {
    const at = manual.value ? new Date(manual.value).getTime() : Date.now();
    if (at < t.yaranakyaAt) { showToast("着手の時刻が「やらなきゃ」より前になっています"); return; }
    const updated = {
      ...t,
      chakushuAt: at,
      chakushuManual: !!manual.value,
      firstStep: stepInput ? (stepInput.value.trim() || null) : (t.firstStep || null),
      reasons: [...picked]
    };
    go.disabled = true;
    try {
      await store.save(updated);
      openId = null;
      const lead = updated.iyasa >= 4 ? "嫌さ" + updated.iyasa + "でも着手！ " : "着手できました！ ";
      showToast(at <= startOf(t) ? lead + "予定より早い着手です" : lead + baseLabel(t) + since(startOf(t), at));
      render();
    } catch (e) {
      showToast("保存できませんでした。もう一度押してください");
      go.disabled = false;
    }
  });
  body.append(go, forgot, manual);
  li.append(body);
  return li;
}

// 取り組み中の課題
function doingCard(t) {
  const li = cardHead(t, "着手から" + since(t.chakushuAt));
  if (openId !== t.id) return li;
  const body = el("div", "task-body");
  if (t.firstStep) body.append(el("span", "q", "最初の一手"), el("div", "step-show", t.firstStep));

  body.append(el("span", "q", "全部でどれくらいかかりそう？（任意）"));
  const chips = el("div", "chips");
  estimateList.forEach(([min, label]) => {
    const b = el("button", null, label);
    b.type = "button";
    b.setAttribute("aria-pressed", t.estimateMin === min);
    b.addEventListener("click", async () => {
      t.estimateMin = t.estimateMin === min ? null : min;
      chips.querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", estimateList[i][0] === t.estimateMin));
      try { await store.save(t); showToast("見積もりを保存しました"); }
      catch (e) { showToast("保存できませんでした"); }
    });
    chips.append(b);
  });
  body.append(chips);

  const done = el("button", "go", "完了した");
  done.type = "button";
  const [forgot, manual] = manualTime("押し忘れた（完了した日時を入力）");
  done.addEventListener("click", async () => {
    const at = manual.value ? new Date(manual.value).getTime() : Date.now();
    if (at < t.chakushuAt) { showToast("完了の時刻が着手より前になっています"); return; }
    done.disabled = true;
    try {
      await store.save({ ...t, completedAt: at, completedManual: !!manual.value });
      openId = null;
      showToast("完了！ 着手から" + since(t.chakushuAt, at));
      render();
    } catch (e) {
      showToast("保存できませんでした。もう一度押してください");
      done.disabled = false;
    }
  });
  body.append(done, forgot, manual);
  li.append(body);
  return li;
}

/* =========================================================
   ⑥ 集計タブ（使う人向け）
   ========================================================= */
// 止まった理由ごとの、次の一手のヒント
const adviceFor = {
  "何から始めるか分からない": "一手を「ファイルを開く」まで小さくしてみよう。紙に箱を3つ書いて流れを描くのも、立派な一手です。",
  "面倒・退屈": "「2分だけ」と決めて始めてみよう。やめてもいいと決めておくと、意外と続きます。",
  "スマホ・動画": "一手をやる間だけ、スマホを別の部屋に置いてみよう。",
  "疲れていた": "疲れている日は、一手をさらに小さく。取り掛かる時間帯を元気な時間に変えるのも手です。",
  "完璧にやりたい": "最初は60点の下書きでOK。一手は「雑に書く」でも大丈夫です。",
  "時間がなかった": "「今はできない」で取り掛かれる時刻を決めて登録しておこう。"
};
function dayKey(ms) { const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

function renderStats() {
  const box = $("stats");
  const started = tasks.filter(t => t.chakushuAt);
  if (!tasks.length) { box.innerHTML = '<p class="empty">まだ記録がありません。「記録」タブから登録してください。</p>'; renderVerify(); return; }
  let h = "";

  // 1. 嫌でも着手できた（モチベーション）
  const tough = started.filter(t => t.iyasa >= 4);
  h += '<section class="stat"><h2>嫌でも着手できた課題</h2>';
  if (!tough.length) {
    h += '<p class="note">嫌さ4以上の課題に着手すると、ここに記録が残ります。</p>';
  } else {
    const med = median(tough.map(delay));
    h += '<p class="big">' + tough.length + '<small>件</small></p>' +
         '<p class="note">嫌さ4以上の課題に着手するまでの時間：中央値 ' + fmtDur(med) + '</p>';
    const best = [...tough].sort((a, b) => b.iyasa - a.iyasa || delay(a) - delay(b))[0];
    h += '<div class="best">いちばん頑張った記録：<b>' + esc(best.title) + '</b>（嫌さ' + best.iyasa + '）に ' +
         (delay(best) < 60000 ? 'すぐ' : fmtDur(delay(best)) + 'で') + '着手</div>';
  }
  h += '</section>';

  // 2. 続けられているか（継続）
  const days = new Set(started.map(t => dayKey(t.chakushuAt)));
  let streak = 0;
  const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);  // 今日まだなら昨日から数える
  while (days.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  h += '<section class="stat"><h2>着手できた日</h2><p class="big">' + streak + '<small>日連続</small></p><div class="week">';
  const names = ["日", "月", "火", "水", "木", "金", "土"];
  for (let i = 6; i >= 0; i--) {
    const x = new Date(); x.setDate(x.getDate() - i);
    const on = days.has(dayKey(x.getTime()));
    h += '<div class="day"><div class="dot' + (on ? ' on' : '') + '"></div>' + (i === 0 ? '今日' : names[x.getDay()]) + '</div>';
  }
  h += '</div><p class="note">1日1回、一手だけでも着手できたら丸がつきます。</p></section>';

  // 3. 次のステップ（止まった理由とヒント）
  const counts = {};
  started.forEach(t => (t.reasons || []).forEach(r => { counts[r] = (counts[r] || 0) + 1; }));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  h += '<section class="stat"><h2>次の一手のヒント</h2>';
  if (!top.length) {
    h += '<p class="note">着手するときに「止まっていた理由」を選ぶと、あなたに合ったヒントが出ます。</p>';
  } else {
    const max = top[0][1];
    const leaders = top.filter(([, c]) => c === max).map(([r]) => r);
    h += '<p>よく止まる理由：<b>' + leaders.map(esc).join("、") + '</b></p>';
    leaders.slice(0, 2).forEach(r => { if (adviceFor[r]) h += '<div class="advice">' + esc(adviceFor[r]) + '</div>'; });
  }
  h += '</section>';

  box.innerHTML = h;
  renderVerify();
}

/* =========================================================
   ⑦ 検証用のくわしいデータ（いつも通り vs 最初の一手）
   ========================================================= */
const modeNames = [["baseline", "いつも通り"], ["ichite", "最初の一手"]];
function renderVerify() {
  const box = $("verifyStats");
  const started = tasks.filter(t => t.chakushuAt);
  const medOf = list => { const m = median(list.map(delay)); return m == null ? "—" : fmtDur(m); };
  let h = "";

  h += '<section class="stat"><h2>取り掛かれる時刻 → 着手までの時間</h2><div class="compare">';
  modeNames.forEach(([m, name]) => {
    const g = started.filter(t => t.mode === m);
    h += '<div class="cmp"><div class="cmp-name">' + name + '</div><div class="cmp-num">' + medOf(g) + '</div><div class="cmp-n">' + g.length + '件</div></div>';
  });
  h += '</div><p class="note">中央値（真ん中の値）で表示。授業中など取り掛かれない時間は除いて計算。</p></section>';

  h += '<section class="stat"><h2>重さ別（中央値）</h2><div class="tbl-wrap"><table><tr><th></th>' +
       modeNames.map(([, n]) => '<th>' + n + '</th>').join("") + '</tr>';
  [1, 2, 3].forEach(w => {
    h += '<tr><td>' + weightName[w] + '</td>';
    modeNames.forEach(([m]) => {
      const g = started.filter(t => t.mode === m && t.weight === w);
      h += '<td>' + medOf(g) + (g.length ? ' <small>(' + g.length + ')</small>' : '') + '</td>';
    });
    h += '</tr>';
  });
  h += '</table></div></section>';

  h += '<section class="stat"><h2>着手前の嫌さ（平均・5段階）</h2><div class="compare">';
  modeNames.forEach(([m, name]) => {
    const g = tasks.filter(t => t.mode === m && t.iyasa);
    const avg = g.length ? (g.reduce((s, t) => s + t.iyasa, 0) / g.length).toFixed(1) : "—";
    h += '<div class="cmp"><div class="cmp-name">' + name + '</div><div class="cmp-num">' + avg + '</div><div class="cmp-n">' + g.length + '件</div></div>';
  });
  h += '</div></section>';

  const counts = {};
  started.forEach(t => (t.reasons || []).forEach(r => { counts[r] = (counts[r] || 0) + 1; }));
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 1;
  h += '<section class="stat"><h2>止まっていた理由</h2>';
  if (!entries.length) h += '<p class="note">まだ選ばれた理由はありません。</p>';
  entries.forEach(([r, c]) => {
    h += '<div class="bar-row"><span>' + esc(r) + '</span><div class="bar"><span style="width:' + (c / max * 100) + '%"></span></div><b>' + c + '</b></div>';
  });
  h += '</section>';

  const est = tasks.filter(t => t.completedAt && t.estimateMin);
  h += '<section class="stat"><h2>見積もりと実際</h2>';
  if (!est.length) h += '<p class="note">見積もりを入れて完了した課題がまだありません。</p>';
  else {
    const ratio = median(est.map(t => (t.completedAt - t.chakushuAt) / (t.estimateMin * 60000)));
    h += '<p>実際にかかった時間は、見積もりの <b>' + ratio.toFixed(1) + '倍</b>（中央値・' + est.length + '件）</p>' +
         '<p class="note">着手から完了までの時間で計算。途中の休憩も含まれます。</p>';
  }
  h += '</section>';

  const n = f => tasks.filter(f).length;
  h += '<section class="stat"><h2>記録の内訳</h2><div class="tbl-wrap"><table>' +
       '<tr><td>全部の記録</td><td>' + tasks.length + '件</td></tr>' +
       '<tr><td>まだ着手していない</td><td>' + n(t => !t.chakushuAt) + '件</td></tr>' +
       '<tr><td>完了した</td><td>' + n(t => t.completedAt) + '件</td></tr>' +
       '<tr><td>今すぐ着手した</td><td>' + n(t => t.nowStart) + '件</td></tr>' +
       '<tr><td>後から記録した</td><td>' + n(t => t.retro) + '件</td></tr>' +
       '<tr><td>押し忘れて時刻を入力</td><td>' + n(t => t.chakushuManual) + '件</td></tr>' +
       '</table></div><p class="note">後から記録した分は記憶に基づくため参考値です。</p></section>';
  box.innerHTML = h;
}

/* =========================================================
   ⑧ 画面の更新
   ========================================================= */
async function render() {
  try { tasks = await store.all(); } catch (e) {}
  renderLists();
  if (currentTab === "stats") renderStats();
}
store.init().then(render);
</script>
</body>
</html>
