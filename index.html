<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すぐ始める記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== 色とフォント（ここを変えると見た目が変わる） ===== */
:root {
  --paper: #EEF1F4;   /* 背景 */
  --card: #FFFFFF;    /* カードの背景 */
  --ink: #1F2A44;     /* 文字 */
  --muted: #6B7488;   /* 補足の文字 */
  --line: #D3D9E2;    /* 枠線 */
  --marker: #F5C518;  /* 主役の色 */
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161B26; --card: #1F2533; --ink: #E8ECF3; --muted: #9AA3B5; --line: #343C4E; --marker: #F2C230;
  }
}
:root[data-theme="dark"] {
  --paper: #161B26; --card: #1F2533; --ink: #E8ECF3; --muted: #9AA3B5; --line: #343C4E; --marker: #F2C230;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.6;
}
main { max-width: 440px; margin: 0 auto; padding: 16px 18px 160px; }
h1 { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; font-size: 1.4rem; margin: 8px 0 2px; }
.sub { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }
h2.sec { font-size: .9rem; color: var(--muted); font-weight: 700; margin: 22px 0 8px; }
h2.sec small { font-weight: 400; margin-left: 6px; }

/* タブ */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; background: var(--paper); border-bottom: 1px solid var(--line); margin: 0 -18px 6px; padding: 0 18px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--paper); }
.tabs button {
  flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  color: var(--muted); font: inherit; font-weight: 700; padding: 10px 2px; cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--marker); }
.badge { display: inline-block; min-width: 1.5em; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: .72rem; line-height: 1.5em; }

/* いつもの一手カード */
.routines { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.routine { position: relative; }
.routine .tap {
  width: 100%; height: 100%; min-height: 92px; text-align: left; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1px solid var(--line); border-left: 5px solid var(--marker);
  border-radius: 14px; padding: 12px 28px 12px 12px; font: inherit;
}
.routine .tap:active { transform: scale(.98); }
.routine .name { display: block; font-weight: 700; font-size: .98rem; line-height: 1.35; }
.routine .step { display: block; color: var(--muted); font-size: .8rem; margin-top: 4px; line-height: 1.4; }
.routine .hide {
  position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; background: none;
  color: var(--muted); font-size: 1rem; cursor: pointer; border-radius: 50%;
}
.empty { color: var(--muted); font-size: .9rem; padding: 6px 0; margin: 0; }
.sugg { margin-top: 8px; }
.scale-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: .72rem; margin-top: 4px; }
.iyasa-pick { margin-top: 4px; }
.sugg .more { border-style: dashed; color: var(--muted); }

/* 新しい課題 */
label { display: block; font-weight: 700; font-size: .92rem; margin: 12px 0 6px; }
.hint { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: 6px; }
input[type="text"], input[type="datetime-local"], input[type="time"], input[type="date"] {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px;
}
input[type="datetime-local"], input[type="time"], input[type="date"] {
  -webkit-appearance: none; appearance: none; display: block; min-width: 0; min-height: 48px; text-align: left;
}
input::-webkit-date-and-time-value { text-align: left; }
.btn-now {
  width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 16px;
  background: var(--marker); color: #1F2A44; cursor: pointer;
  font-family: "Zen Maru Gothic", sans-serif; font-size: 1.25rem; font-weight: 700;
}
.btn-now small, .btn-later small { display: block; font-family: inherit; font-size: .76rem; font-weight: 500; margin-top: 2px; }
.btn-later {
  width: 100%; margin-top: 10px; padding: 12px; border: 2px solid var(--ink); border-radius: 16px;
  background: none; color: var(--ink); cursor: pointer;
  font-family: "Zen Maru Gothic", sans-serif; font-size: 1rem; font-weight: 700;
}
.btn-now:disabled, .btn-later:disabled { opacity: .4; cursor: not-allowed; }
.panel { margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 16px; }
.choices { display: flex; gap: 8px; }
.choices button {
  flex: 1; font: inherit; font-size: .92rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; cursor: pointer;
}
.choices button[aria-pressed="true"] { border: 2px solid var(--ink); font-weight: 700; padding: 9px 0; }
.btn-save {
  width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px;
  background: var(--ink); color: var(--paper); cursor: pointer; font: inherit; font-weight: 700;
}
#startTime { margin-top: 8px; }
.link { display: block; background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: .82rem; margin: 10px 0 0; padding: 4px 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }

/* 一覧 */
ul.tasks { list-style: none; padding: 0; margin: 0; }
li.task { border-bottom: 1px dashed var(--line); }
.task-head {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  background: none; border: 0; color: var(--ink); font: inherit; font-size: .95rem;
  padding: 13px 0; text-align: left; cursor: pointer;
}
.task-time { color: var(--muted); white-space: nowrap; font-size: .8rem; }
.task-body { padding: 0 0 18px; }
.task-body .q { display: block; font-weight: 700; margin: 8px 0 6px; font-size: .88rem; }
.step-show { background: var(--card); border-left: 3px solid var(--marker); border-radius: 6px; padding: 8px 12px; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  font: inherit; font-size: .82rem; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.go {
  width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 12px;
  background: var(--ink); color: var(--paper); cursor: pointer;
  font-family: "Zen Maru Gothic", sans-serif; font-size: 1.1rem; font-weight: 700;
}
.go:disabled { opacity: .5; }
.go small { display: block; font-family: inherit; font-size: .76rem; font-weight: 500; margin-top: 2px; }
#dueDate { margin-top: 8px; }
/* 次はこれ */
.next-card { background: var(--card); border: 2px solid var(--marker); border-radius: 16px; padding: 14px 14px 2px; }
.next-title { font-family: "Zen Maru Gothic", sans-serif; font-size: 1.25rem; font-weight: 700; line-height: 1.4; }
.next-meta { color: var(--muted); font-size: .82rem; }
.next-card .task-body { padding-bottom: 12px; }
.other-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.other-head .link { margin: 0; flex: none; }
.edit-box { margin-top: 8px; padding: 2px 12px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.edit-actions { display: flex; gap: 8px; }
.edit-actions .btn-save { flex: 2; }
.btn-del { flex: 1; margin-top: 14px; padding: 13px; border: 1px solid #D9512C; color: #D9512C; background: none; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; }

/* 着手した後のシート（嫌さを聞く） */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--card); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 24px rgba(0,0,0,.15);
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px));
}
.sheet-inner { max-width: 440px; margin: 0 auto; }
.sheet h3 { font-family: "Zen Maru Gothic", sans-serif; margin: 0; font-size: 1.15rem; }
.sheet p { margin: 2px 0 10px; color: var(--muted); font-size: .88rem; }
.sheet .scale-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: .72rem; margin-top: 4px; }
.sheet-actions { display: flex; justify-content: space-between; margin-top: 8px; }
.sheet-actions .link { margin: 0; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 12px 18px;
  text-align: center; font-weight: 700; font-size: .92rem;
}
#toast:empty { display: none; }

/* 集計 */
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; }
.stat h2 { font-size: .95rem; margin: 0 0 8px; }
.stat p { margin: 0; }
.big { font-family: "Zen Maru Gothic", sans-serif; font-size: 2.2rem; font-weight: 700; line-height: 1.15; }
.big small { font-size: .95rem; margin-left: 2px; }
.stat .note { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.pair .stat { margin-top: 0; }
.pair .big { font-size: 1.8rem; }
.week { display: flex; justify-content: space-between; margin-top: 12px; }
.day { flex: 1; text-align: center; font-size: .72rem; color: var(--muted); }
.dot { width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 50%; border: 2px solid var(--line); }
.dot.on { background: var(--marker); border-color: var(--marker); }
.rank { list-style: none; padding: 0; margin: 0; }
.rank li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.rank li:last-child { border-bottom: 0; }
.rank b { white-space: nowrap; }
.advice { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--marker); background: var(--paper); border-radius: 6px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>すぐ始める記録</h1>
  <p class="sub">2分でできる最初の一手だけ、やってみる。</p>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="start" aria-selected="true">着手</button>
    <button type="button" role="tab" data-tab="list" aria-selected="false">一覧<span class="badge" id="listBadge" hidden></span></button>
    <button type="button" role="tab" data-tab="stats" aria-selected="false">集計</button>
  </nav>

  <!-- ===== 着手タブ ===== -->
  <section id="tab-start">
    <label for="title" style="margin-top:14px">課題名<span class="hint">2回以上使うと候補に出ます</span></label>
    <input type="text" id="title" placeholder="例：英語のレポート" autocomplete="off">
    <div class="chips sugg" id="titleSugg" hidden></div>
    <label for="firstStep">最初の一手<span class="hint">2分でできること</span></label>
    <input type="text" id="firstStep" placeholder="例：Wordを開いてタイトルを書く" autocomplete="off">
    <div class="chips sugg" id="stepSugg" hidden></div>
    <button type="button" class="link" id="suggEdit" hidden>候補を整理</button>
    <label>嫌さ<span class="hint">任意・今の気持ち</span></label>
    <div class="choices" id="iyasaIn">
      <button type="button" data-v="1">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="4">4</button>
      <button type="button" data-v="5">5</button>
    </div>
    <div class="scale-ends"><span>平気</span><span>かなり嫌</span></div>

    <button type="button" class="btn-now" id="btnNow" disabled>今すぐ着手する<small>一手を始めたらタップ</small></button>
    <button type="button" class="btn-later" id="btnLater" disabled aria-expanded="false">今はできない（やらなきゃ）<small>取り掛かれる時刻を決めて登録</small></button>
    <div class="panel" id="laterPanel" hidden>
      <label>いつから取り掛かれる？</label>
      <div class="choices" id="startable">
        <button type="button" data-v="0" aria-pressed="true">今から</button>
        <button type="button" data-v="30">30分後</button>
        <button type="button" data-v="60">1時間後</button>
        <button type="button" data-v="custom">時刻指定</button>
      </div>
      <input type="time" id="startTime" hidden>
      <label>締め切り<span class="hint">任意・どれからやるかの順番に使います</span></label>
      <div class="choices" id="due">
        <button type="button" data-v="today">今日</button>
        <button type="button" data-v="tomorrow">明日</button>
        <button type="button" data-v="week">今週</button>
        <button type="button" data-v="date">日付</button>
      </div>
      <input type="date" id="dueDate" hidden>
      <label>重さ<span class="hint">任意</span></label>
      <div class="choices" id="weight">
        <button type="button" data-v="1">軽い</button>
        <button type="button" data-v="2">普通</button>
        <button type="button" data-v="3">重い</button>
      </div>
      <button type="button" class="btn-save" id="btnLaterSave">やらなきゃに登録</button>
    </div>
  </section>

  <!-- ===== 一覧タブ ===== -->
  <section id="tab-list" hidden>
    <div id="nextBox"></div>
    <div class="other-head" id="otherHead">
      <h2 class="sec">ほかの課題（<span id="otherCount">0</span>件）<small>優先度順</small></h2>
      <button type="button" class="link" id="otherToggle">表示する</button>
    </div>
    <ul class="tasks" id="list" hidden></ul>
    <h2 class="sec">取り組み中<small>タップして完了</small></h2>
    <ul class="tasks" id="doing"></ul>
    <div class="other-head" id="doneHead" hidden>
      <h2 class="sec">完了した課題（<span id="doneCount">0</span>件）<small>新しい順</small></h2>
      <button type="button" class="link" id="doneToggle">表示する</button>
    </div>
    <ul class="tasks" id="done" hidden></ul>
  </section>

  <!-- ===== 集計タブ ===== -->
  <section id="tab-stats" hidden>
    <div id="stats"></div>
  </section>
</main>

<!-- 着手した後に出るシート -->
<div class="sheet" id="sheet" hidden role="dialog" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <h3 id="sheetTitle">着手できました！</h3>
    <p id="sheetText"></p>
    <div class="choices" id="iyasa">
      <button type="button" data-v="1">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="4">4</button>
      <button type="button" data-v="5">5</button>
    </div>
    <div class="scale-ends"><span>平気だった</span><span>かなり嫌だった</span></div>
    <div class="sheet-actions">
      <button type="button" class="link" id="sheetUndo">取り消す</button>
      <button type="button" class="link" id="sheetClose">答えずに閉じる</button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
/* =========================================================
   ① データの保存（ここは触らなくてOK）
   claude.ai上ではアカウントに保存。使えない時はこの端末に保存。
   ========================================================= */
const store = {
  db: null, uid: null,
  async init() {
    try {
      if (window.claude && claude.use) {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        const uid = user ? await user.id() : null;
        if (db && uid) { this.db = db; this.uid = uid; }
      }
    } catch (e) { /* 端末保存に切り替え */ }
  },
  col() { return this.db.collection("data/users/" + this.uid + "/tasks"); },
  localAll() { try { return JSON.parse(localStorage.getItem("tasks") || "[]"); } catch (e) { return []; } },
  localSet(list) { try { localStorage.setItem("tasks", JSON.stringify(list)); } catch (e) {} },
  async all() {
    if (this.db) { const s = await this.col().get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); }
    return this.localAll();
  },
  async save(task) {
    if (this.db) { const { id, ...body } = task; return this.col().doc(id).set(body); }
    const list = this.localAll().filter(t => t.id !== task.id); list.push(task); this.localSet(list);
  },
  async remove(id) {
    if (this.db) return this.col().doc(id).delete();
    this.localSet(this.localAll().filter(t => t.id !== id));
  }
};

/* =========================================================
   ② 共通の道具
   ========================================================= */
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function clock(ms) {
  const d = new Date(ms);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
}
function since(from, to) {
  const m = Math.max(0, Math.floor(((to || Date.now()) - from) / 60000));
  if (m < 60) return m + "分";
  if (m < 1440) return Math.floor(m / 60) + "時間";
  return Math.floor(m / 1440) + "日";
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function showToast(msg) {
  const t = $("toast"); t.textContent = msg;
  clearTimeout(showToast.timer); showToast.timer = setTimeout(() => t.textContent = "", 3000);
}
const startOf = t => t.startableAt || t.yaranakyaAt;
const newId = () => "t" + Date.now() + Math.random().toString(36).slice(2, 6);

/* =========================================================
   ③ タブ
   ========================================================= */
let currentTab = "start";
let tasks = [];
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function showTab(name) {
  currentTab = name;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === name));
  ["start", "list", "stats"].forEach(n => $("tab-" + n).hidden = n !== name);
  window.scrollTo(0, 0);
  render();
}

/* =========================================================
   ④ 着手したあとのシート（嫌さは着手の「後」に聞く）
   ========================================================= */
let sheetTask = null, sheetUndo = null;
function openSheet(task, undo) {
  sheetTask = task; sheetUndo = undo;
  $("sheetText").textContent = "「" + task.title + "」　着手する前、どれくらい嫌でしたか？（任意）";
  document.querySelectorAll("#iyasa button").forEach(b => b.setAttribute("aria-pressed", false));
  $("sheet").hidden = false;
}
function closeSheet() { $("sheet").hidden = true; sheetTask = null; sheetUndo = null; }
document.querySelectorAll("#iyasa button").forEach(b => b.addEventListener("click", async () => {
  if (!sheetTask) return;
  const v = Number(b.dataset.v);
  const t = { ...sheetTask, iyasa: v };
  closeSheet();
  try { await store.save(t); } catch (e) {}
  showToast(v >= 4 ? "嫌さ" + v + "でも踏み出せました！" : "記録しました。その調子です");
  render();
}));
$("sheetClose").addEventListener("click", closeSheet);
$("sheetUndo").addEventListener("click", async () => {
  const undo = sheetUndo;
  closeSheet();
  if (undo) { try { await undo(); showToast("取り消しました"); } catch (e) { showToast("取り消せませんでした"); } }
  render();
});

/* =========================================================
   ⑤ 着手タブ
   ========================================================= */
// 「いつもの一手」：過去の課題から、課題名ごとに最新の一手をカードにする
function hiddenSet() { try { return new Set(JSON.parse(localStorage.getItem("hiddenRoutines") || "[]")); } catch (e) { return new Set(); } }
function hideRoutine(title) {
  const s = hiddenSet(); s.add(title);
  try { localStorage.setItem("hiddenRoutines", JSON.stringify([...s])); } catch (e) {}
}
function unhideRoutine(title) {
  const s = hiddenSet(); s.delete(title);
  try { localStorage.setItem("hiddenRoutines", JSON.stringify([...s])); } catch (e) {}
}
// 末尾の番号を取り除いた名前（「BMケース課題4」→「BMケース課題」）。同じ科目をまとめるため
// 「7th」「第3回」のような書き方にも対応
const NUM_END = /[\s_\-－#＃第]*([0-9０-９]+)(st|nd|rd|th|回)?$/i;
const baseName = s => s.replace(NUM_END, "").trim() || s;
const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
function nextTitle(latest, n) {
  const m = latest.match(/([0-9０-９]+)(st|nd|rd|th|回)?$/i);
  if (!m) return latest + n;
  const suffix = m[2] || "";
  const num = /^(st|nd|rd|th)$/i.test(suffix) ? ordinal(n) : n + suffix;
  return latest.slice(0, m.index) + num;
}
const numOf = s => {
  const m = s.match(/([0-9０-９]+)(st|nd|rd|th|回)?$/i);
  return m ? Number(m[1].replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))) : 0;
};
function routines() {
  const hidden = hiddenSet(), map = new Map();
  [...tasks].sort((a, b) => (b.yaranakyaAt || 0) - (a.yaranakyaAt || 0)).forEach(t => {
    if (!t.title) return;
    const key = baseName(t.title);
    if (hidden.has(key)) return;
    const r = map.get(key);
    if (!r) map.set(key, { title: key, latest: t.title, firstStep: t.firstStep || null, count: 1, numbered: t.title !== key, maxNo: numOf(t.title) });
    else {
      r.count++;
      r.numbered = r.numbered || t.title !== key;
      r.maxNo = Math.max(r.maxNo, numOf(t.title));
      if (!r.firstStep && t.firstStep) r.firstStep = t.firstStep;
    }
  });
  const list = [...map.values()];
  list.forEach(r => {
    // 次の番号をつけた課題名（最新の書き方に合わせる）
    if (r.numbered) r.next = nextTitle(r.latest, r.maxNo + 1);
  });
  return list;
}
// 候補：課題名と一手を「別々に」使い回す（同じ科目でも一手は課題ごとに違うため）
let showAllTitles = false, showAllSteps = false, editSugg = false;
// 候補から外した一手（この端末に保存）
function hiddenSteps() { try { return new Set(JSON.parse(localStorage.getItem("hiddenSteps") || "[]")); } catch (e) { return new Set(); } }
function hideStep(v) {
  const h = hiddenSteps(); h.add(v);
  try { localStorage.setItem("hiddenSteps", JSON.stringify([...h])); } catch (e) {}
}
function stepList() {
  const hidden = hiddenSteps(), map = new Map();
  [...tasks].sort((a, b) => (b.yaranakyaAt || 0) - (a.yaranakyaAt || 0)).forEach(t => {
    if (!t.firstStep || hidden.has(t.firstStep)) return;
    const r = map.get(t.firstStep);
    if (!r) map.set(t.firstStep, { step: t.firstStep, count: 1 });
    else r.count++;
  });
  // よく使う順（同じ回数なら最近使った順）
  return [...map.values()].sort((a, b) => b.count - a.count);
}
// items: [{ label: 表示・入力する文字, onHide: 候補から外す処理 }]
function suggChips(boxId, items, inputId, showAll, onToggle) {
  const box = $(boxId);
  box.innerHTML = "";
  const shown = showAll ? items : items.slice(0, 6);
  shown.forEach(it => {
    const v = it.label;
    const b = el("button", null, editSugg ? "× " + v : v);
    b.type = "button";
    b.setAttribute("aria-pressed", !editSugg && $(inputId).value.trim() === v);
    b.addEventListener("click", () => {
      if (editSugg) { it.onHide(); showToast("「" + v + "」を候補から外しました"); }
      else { $(inputId).value = $(inputId).value.trim() === v ? "" : v; checkReady(); }
      renderRoutines();
    });
    box.append(b);
  });
  if (items.length > 6) {
    const more = el("button", "more", showAll ? "たたむ" : "ほか" + (items.length - 6) + "件");
    more.type = "button";
    more.addEventListener("click", onToggle);
    box.append(more);
  }
  box.hidden = !items.length;
}
function renderRoutines() {
  // 使い回すものだけを候補にする：2回以上使ったもの、または番号つき（シリーズ）の課題
  const titles = routines().filter(r => r.count >= 2 || r.numbered)
    .map(r => ({ label: r.numbered ? r.next : r.title, onHide: () => hideRoutine(r.title) }));
  const steps = stepList().filter(r => r.count >= 2)
    .map(r => ({ label: r.step, onHide: () => hideStep(r.step) }));
  suggChips("titleSugg", titles, "title", showAllTitles, () => { showAllTitles = !showAllTitles; renderRoutines(); });
  suggChips("stepSugg", steps, "firstStep", showAllSteps, () => { showAllSteps = !showAllSteps; renderRoutines(); });
  $("suggEdit").hidden = !titles.length && !steps.length;
  $("suggEdit").textContent = editSugg ? "整理を終える" : "候補を整理";
}
$("suggEdit").addEventListener("click", () => { editSugg = !editSugg; renderRoutines(); });
$("title").addEventListener("input", () => renderRoutines());
$("firstStep").addEventListener("input", () => renderRoutines());

// 今すぐ着手（カードのタップ、または新しい課題）
async function startNow(title, firstStep) {
  const now = Date.now();
  const iyasa = form.iyasa ? Number(form.iyasa) : null;
  const task = { id: newId(), title, firstStep: firstStep || null, yaranakyaAt: now, startableAt: now, chakushuAt: now, nowStart: true, iyasa };

    unhideRoutine(baseName(title));
    if (iyasa) showToast(iyasa >= 4 ? "嫌さ" + iyasa + "でも踏み出せました！" : "着手できました！ その調子です");
    else openSheet(task, () => store.remove(task.id));
    render();
  } catch (e) { showToast("保存できませんでした。もう一度押してください"); }
}

function calcStartable(now) {
  if (form.startIn === "custom" && $("startTime").value) {
    const [hh, mm] = $("startTime").value.split(":").map(Number);
    const d = new Date(now);
    d.setHours(hh, mm, 0, 0);
    if (d.getTime() < now - 60000) d.setDate(d.getDate() + 1);  // もう過ぎた時刻なら翌日
    return d.getTime();
  }
  return now + (Number(form.startIn) || 0) * 60000;
}
// 締め切りと重さ（任意。もう一度押すと選択を外せる）
form.due = null; form.weight = null;
function toggleChoice(groupId, key, onChange) {
  document.querySelectorAll("#" + groupId + " button").forEach(b => b.addEventListener("click", () => {
    form[key] = form[key] === b.dataset.v ? null : b.dataset.v;

function calcDue(now) {
  const d = new Date(now);
  d.setHours(23, 59, 0, 0);
  if (form.due === "today") return d.getTime();
  if (form.due === "tomorrow") { d.setDate(d.getDate() + 1); return d.getTime(); }
  if (form.due === "week") { d.setDate(d.getDate() + ((7 - d.getDay()) % 7)); return d.getTime(); }  // 今週の日曜
  if (form.due === "date" && $("dueDate").value) {
    const [y, m, dd] = $("dueDate").value.split("-").map(Number);
    return new Date(y, m - 1, dd, 23, 59).getTime();
  }
  return null;
}

// 止まっていた理由（原因分析から）。ここを書き換えると選択肢が変わる
const reasonList = ["何から始めるか分からない", "面倒・退屈", "スマホ・動画", "疲れていた", "完璧にやりたい", "時間がなかった"];
let openId = null;

function waitLabel(t) {
  const s = startOf(t);
  if (s > Date.now()) return clock(s) + "から";
  return (t.startableAt && t.startableAt !== t.yaranakyaAt ? "取り掛かれる時刻から" : "やらなきゃから") + since(s);
}
// 優先度：締め切りが近い順 → 同じなら軽い順（未選択は普通扱い）→ 取り掛かれる時刻の順
const wOf = t => t.weight || 2;
function byPriority(a, b) {
  const da = a.deadline || Infinity, db = b.deadline || Infinity;
  if (da !== db) return da - db;
  if (wOf(a) !== wOf(b)) return wOf(a) - wOf(b);
  return startOf(a) - startOf(b);
}
function dueLabel(ms) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(ms); b.setHours(0, 0, 0, 0);
  const diff = Math.round((b - a) / 86400000);
  if (diff < 0) return "締切を過ぎています";
  if (diff === 0) return "締切 今日";
  if (diff === 1) return "締切 明日";
  return "締切 " + (b.getMonth() + 1) + "/" + b.getDate();
}
const weightName = { 1: "軽い", 2: "普通", 3: "重い" };
function rightLabel(t) { return t.deadline ? dueLabel(t.deadline) : waitLabel(t); }
function metaLabel(t) {
  const parts = [];
  if (t.deadline) parts.push(dueLabel(t.deadline));
  if (t.weight) parts.push("重さ：" + weightName[t.weight]);
  parts.push(waitLabel(t));
  return parts.join("　");
}
let showOthers = false;
$("otherToggle").addEventListener("click", () => { showOthers = !showOthers; renderLists(); });

function renderLists() {
  const waiting = tasks.filter(t => !t.chakushuAt).sort(byPriority);
  const doing = tasks.filter(t => t.chakushuAt && !t.completedAt).sort((a, b) => b.chakushuAt - a.chakushuAt);
  $("listBadge").hidden = !waiting.length;
  $("listBadge").textContent = waiting.length;
  if (currentTab !== "list") return;
  // 「次はこれ」：今取り掛かれる課題のうち優先度が一番高いもの（なければ全体の1位）
  const now = Date.now();
  const next = waiting.find(t => startOf(t) <= now) || waiting[0];
  const others = waiting.filter(t => t !== next);
  const nb = $("nextBox");
  nb.innerHTML = "";
  nb.append(el("h2", "sec", "次はこれ"));
  if (next) nb.append(waitingCard(next, true));
  else nb.append(el("p", "empty", "まだ着手していない課題はありません"));
  $("otherHead").hidden = !others.length;
  $("otherCount").textContent = others.length;
  $("otherToggle").textContent = showOthers ? "たたむ" : "表示する";
  const ul = $("list"), ul2 = $("doing");
  ul.innerHTML = ""; ul2.innerHTML = "";
  ul.hidden = !showOthers || !others.length;
  others.forEach(t => ul.append(waitingCard(t)));
  if (!doing.length) ul2.append(el("li", "empty", "着手した課題がここに出ます"));
  doing.forEach(t => ul2.append(doingCard(t)));
  // 完了した課題（嫌さを後から答えたり直したりできる）
  const doneList = tasks.filter(t => t.completedAt).sort((a, b) => b.completedAt - a.completedAt);
  $("doneHead").hidden = !doneList.length;
  $("doneCount").textContent = doneList.length;
  $("doneToggle").textContent = showDone ? "たたむ" : "表示する";
  const ul3 = $("done");
  ul3.innerHTML = "";
  ul3.hidden = !showDone || !doneList.length;
  doneList.forEach(t => ul3.append(doneCard(t)));
}
function cardHead(t, right) {
  const li = el("li", "task");

  head.setAttribute("aria-expanded", openId === t.id);

  head.addEventListener("click", () => { openId = openId === t.id ? null : t.id; renderLists(); });

}
function manualTime(label) {
  const forgot = el("button", "link", label);
  forgot.type = "button";
  const input = el("input");
  input.type = "datetime-local";

// 編集・削除（課題名と最初の一手を直せる）
function editBlock(t) {
  const wrap = el("div");
  const open = el("button", "link", "編集・削除");
  open.type = "button";
  const box = el("div", "edit-box");
  box.hidden = true;

  box.append(el("span", "q", "課題名"), ti, el("span", "q", "最初の一手"), si);
  const row = el("div", "edit-actions");

    try { await store.save({ ...t, title, firstStep: si.value.trim() || null }); openId = null; showToast("保存しました"); render(); }
    catch (e) { showToast("保存できませんでした"); }
  });
  // 削除は2回押しで確定（押し間違い防止）
  let armed = false;
  del.addEventListener("click", async () => {
    if (!armed) { armed = true; del.textContent = "もう一度で削除"; return; }
    try { await store.remove(t.id); openId = null; showToast("削除しました"); render(); }
    catch (e) { showToast("削除できませんでした"); }
  });
  wrap.append(open, box);
  return wrap;

// まだ着手していない課題
function waitingCard(t, isNext) {
  // 「次はこれ」は最初から開いた状態で大きく表示
  const li = isNext ? el("div", "next-card") : cardHead(t, rightLabel(t));
  if (isNext) li.append(el("div", "next-title", t.title), el("div", "next-meta", metaLabel(t)));
  if (!isNext && openId !== t.id) return li;
  const body = el("div", "task-body");
  let stepInput = null;
  if (t.firstStep) {
    body.append(el("span", "q", "最初の一手"), el("div", "step-show", t.firstStep));
  } else {
    body.append(el("span", "q", "最初の一手（2分でできること）"));
    stepInput = el("input");
    stepInput.type = "text";
    stepInput.placeholder = "例：Wordを開いてタイトルを書く";
    body.append(stepInput);
  }
  body.append(el("span", "q", "止まっていた理由（あれば）"));
  const chips = el("div", "chips");
  const picked = new Set(t.reasons || []);
  reasonList.forEach(r => {
    const b = el("button", null, r);
    b.type = "button";
    b.setAttribute("aria-pressed", picked.has(r));
    b.addEventListener("click", () => {
      picked.has(r) ? picked.delete(r) : picked.add(r);
      b.setAttribute("aria-pressed", picked.has(r));
    });
    chips.append(b);
  });
  body.append(chips);

  const go = el("button", "go", "着手する");
  go.append(el("small", null, "押したら、一手だけやろう"));
  go.type = "button";
  const [forgot, manual] = manualTime("押し忘れた（着手した日時を入力）");
  go.addEventListener("click", async () => {
    const at = manual.value ? new Date(manual.value).getTime() : Date.now();
    if (at < t.yaranakyaAt) { showToast("着手の時刻が「やらなきゃ」より前になっています"); return; }
    const before = { ...t };
    const updated = { ...t, chakushuAt: at, chakushuManual: !!manual.value,
      firstStep: stepInput ? (stepInput.value.trim() || null) : (t.firstStep || null), reasons: [...picked] };
    go.disabled = true;
    try {
      await store.save(updated);
      openId = null;
      if (updated.iyasa) showToast(updated.iyasa >= 4 ? "嫌さ" + updated.iyasa + "でも踏み出せました！" : "着手できました！ その調子です");
      else openSheet(updated, () => store.save(before));
      render();
    } catch (e) { showToast("保存できませんでした。もう一度押してください"); go.disabled = false; }
  });
  body.append(go, forgot, manual, editBlock(t));
  li.append(body);
  return li;
}

// 取り組み中の課題
function doingCard(t) {
  const li = cardHead(t, "着手から" + since(t.chakushuAt));
  if (openId !== t.id) return li;
  const body = el("div", "task-body");
  if (t.firstStep) body.append(el("span", "q", "最初の一手"), el("div", "step-show", t.firstStep));
  body.append(iyasaPicker(t));

const adviceFor = {
  "何から始めるか分からない": "一手を「ファイルを開く」まで小さくしてみよう。紙に箱を3つ書いて流れを描くのも、立派な一手です。",
  "面倒・退屈": "「2分だけ」と決めて始めてみよう。やめてもいいと決めておくと、意外と続きます。",
  "スマホ・動画": "一手をやる間だけ、スマホを別の部屋に置いてみよう。",
  "疲れていた": "疲れている日は、一手をさらに小さく。取り掛かる時間帯を元気な時間に変えるのも手です。",
  "完璧にやりたい": "最初は60点の下書きでOK。一手は「雑に書く」でも大丈夫です。",
  "時間がなかった": "「今はできない」で取り掛かれる時刻を決めて登録しておこう。"
};
function dayKey(ms) { const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

function renderStats() {
  const box = $("stats");
  const started = tasks.filter(t => t.chakushuAt);
  if (!started.length) { box.innerHTML = '<p class="empty" style="margin-top:14px">一手に着手すると、ここに記録が出ます。</p>'; return; }
  let h = "";

  // 1. この7日間の一歩目（いちばん大事な数字）
  const weekAgo = Date.now() - 7 * 86400000;
  const thisWeek = started.filter(t => t.chakushuAt >= weekAgo).length;
  h += '<section class="stat"><h2>この7日間に踏み出した一歩目</h2><p class="big">' + thisWeek + '<small>回</small></p>' +
       '<p class="note">これまでの合計：' + started.length + '回</p></section>';

  // 2. 着手できた日（継続）
  const days = new Set(started.map(t => dayKey(t.chakushuAt)));
  let streak = 0;
  const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);  // 今日まだなら昨日から数える
  while (days.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  h += '<section class="stat"><h2>着手できた日</h2><p class="big">' + streak + '<small>日連続</small></p><div class="week">';
  const names = ["日", "月", "火", "水", "木", "金", "土"];
  for (let i = 6; i >= 0; i--) {
    const x = new Date(); x.setDate(x.getDate() - i);
    h += '<div class="day"><div class="dot' + (days.has(dayKey(x.getTime())) ? ' on' : '') + '"></div>' + (i === 0 ? '今日' : names[x.getDay()]) + '</div>';
  }
  h += '</div></section>';

  // 3. 嫌でも踏み出せた／一手から完了まで行けた
  const tough = started.filter(t => t.iyasa >= 4).length;
  const withStep = started.filter(t => t.firstStep);
  const finished = withStep.filter(t => t.completedAt).length;
  h += '<div class="pair">' +
       '<section class="stat"><h2>嫌でも踏み出せた</h2><p class="big">' + tough + '<small>回</small></p><p class="note">嫌さ4以上で着手</p></section>' +
       '<section class="stat"><h2>一手から完了まで</h2><p class="big">' + finished + '<small>回</small></p><p class="note">一手だけのつもりが最後まで</p></section>' +
       '</div>';

  // 4. よく使う一手
  const stepCount = {};
  withStep.forEach(t => { stepCount[t.firstStep] = (stepCount[t.firstStep] || 0) + 1; });
  const topSteps = Object.entries(stepCount).sort((a, b) => b[1] - a[1]).slice(0, 3);
  h += '<section class="stat"><h2>よく使う一手</h2>';
  if (!topSteps.length) h += '<p class="note">一手を書いて着手すると、ここに出ます。</p>';
  else h += '<ul class="rank">' + topSteps.map(([s, c]) => '<li><span>' + esc(s) + '</span><b>' + c + '回</b></li>').join("") + '</ul>';
  h += '</section>';

  // 5. 次の一手のヒント
  const counts = {};
  started.forEach(t => (t.reasons || []).forEach(r => { counts[r] = (counts[r] || 0) + 1; }));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (top.length) {
    const max = top[0][1];
    const leaders = top.filter(([, c]) => c === max).map(([r]) => r);
    h += '<section class="stat"><h2>次の一手のヒント</h2><p>よく止まる理由：<b>' + leaders.map(esc).join("、") + '</b></p>';
    leaders.slice(0, 2).forEach(r => { if (adviceFor[r]) h += '<div class="advice">' + esc(adviceFor[r]) + '</div>'; });
    h += '</section>';
  }
  box.innerHTML = h;
}

/* =========================================================
   ⑧ 画面の更新
   ========================================================= */
async function render() {
  try { tasks = await store.all(); } catch (e) {}
  renderRoutines();
  renderLists();
  if (currentTab === "stats") renderStats();
}
// 嫌さ（最初の入力欄）
toggleChoice("iyasaIn", "iyasa");

// 完了した課題の表示
let showDone = false;
$("doneToggle").addEventListener("click", () => { showDone = !showDone; renderLists(); });
function iyasaPicker(t) {
  const wrap = el("div", "iyasa-pick");
  wrap.append(el("span", "q", t.iyasa ? "着手前の嫌さ（タップで直せます）" : "着手前の嫌さ（まだ答えていません）"));
  const row = el("div", "choices");
  [1, 2, 3, 4, 5].forEach(v => {
    const b = el("button", null, String(v));
    b.type = "button";
    b.setAttribute("aria-pressed", t.iyasa === v);
    b.addEventListener("click", async () => {
      try { await store.save({ ...t, iyasa: v }); showToast("嫌さ" + v + "で記録しました"); render(); }
      catch (e) { showToast("保存できませんでした"); }
    });
    row.append(b);
  });
  wrap.append(row);
  return wrap;
}
function doneCard(t) {
  const li = cardHead(t, "完了 " + clock(t.completedAt));
  if (openId !== t.id) return li;
  const body = el("div", "task-body");
  if (t.firstStep) body.append(el("span", "q", "最初の一手"), el("div", "step-show", t.firstStep));
  body.append(el("p", "empty", "着手から完了まで：" + since(t.chakushuAt, t.completedAt)));
  body.append(iyasaPicker(t), editBlock(t));
  li.append(body);
  return li;
}

store.init().then(render);
</script>
